#:schema https://developers.openai.com/codex/config-schema.json

# Model configuration
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
approvals_reviewer = "guardian_subagent"

# Permissions
default_permissions = ":workspace"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "context-remaining",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
status_line_use_colors = true
